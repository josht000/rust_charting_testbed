<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DigiTrader</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #101010; }
      body { overflow: auto; }
      #canvas { display: block; width: max(100vw, 800px) !important; height: max(100vh, 520px) !important; min-width: 0 !important; min-height: 0 !important; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="module">
      const version = Date.now();
      const { default: init } = await import(`./pkg/digitrader.js?v=${version}`);
      await init({ module_or_path: `./pkg/digitrader_bg.wasm?v=${version}` });
    </script>
  </body>
</html>
