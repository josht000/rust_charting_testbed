[package]
name = "digitrader"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[lib]
name = "digitrader"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "digitrader-desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "std"] }
datagen = { path = "../shared/datagen" }
indicators = { path = "../shared/indicators" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

[features]
default = ["slint/default"]

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "console", "Window", "Location", "Performance", "Document",
    "HtmlElement", "HtmlCanvasElement",
] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
slint = { version = "=1.18.1", features = ["backend-winit", "renderer-femtovg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
