[package]
name = "egui_testbed"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.36.2", features = ["wgpu"] }
egui = "0.36"
egui_dock = "0.21.1"
egui-wgpu = "0.36"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
datagen = { path = "../shared/datagen" }
indicators = { path = "../shared/indicators" }
ta = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sysinfo = "0.39"
env_logger = "0.11"
chrono = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Location",
    "Navigator",
    "Performance",
    "Window",
    "Url",
    "Blob",
    "HtmlAnchorElement",
] }

[profile.release]
opt-level = 3
lto = true

[profile.release.package."*"]
opt-level = 3
